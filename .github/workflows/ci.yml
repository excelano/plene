# The suite, the clippy rule, formatting, the toolchain floor, and the rule
# against compiling C, on every push and pull request.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: What is installed
        run: rustc -V && cargo -V

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace

      # `CLAUDE.md` says clippy must be silent, so a warning is an error here.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatted
        run: cargo fmt --check

      # Checked by outcome: no object file under the build directory, and the
      # binaries linking libc and libgcc and nothing else.
      - name: Nothing compiled C
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          objects=$(find "${target}" -path '*/build/*' \( -name '*.o' -o -name '*.a' \) -print)
          [ -z "$objects" ] || { echo "a build script produced object files:"; echo "$objects"; exit 1; }

          # The window's display libraries are opened by name at run time, so
          # it links the same set; packaging/linux/check-libraries.sh measures
          # what it opens, with a display.
          for binary in plene plene-gui; do
              echo "${binary} links at load time:"
              ldd "${target}/debug/${binary}" | sed 's/^/  /'
              strange=$(ldd "${target}/debug/${binary}" |
                  awk '{print $1}' | grep -vE '^(linux-vdso|libgcc_s|libm|libc|/lib(64)?/ld-linux)' || true)
              [ -z "$strange" ] || { echo "unexpected shared libraries:"; echo "$strange"; exit 1; }
          done

  # `rust-version` in Cargo.toml is a claim, and this makes it a measurement.
  # The number is read out of the manifest rather than written here twice.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build at the floor
        run: |
          floor=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "floor: ${floor}"
          rustup toolchain install "$floor" --profile minimal
          cargo "+${floor}" build --all-targets
