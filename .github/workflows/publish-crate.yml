name: Publish to crates.io

# Fires on the version tag `ship` pushes, and can be run by hand. `cargo publish`
# compiles and uploads from source, so it is independent of the `.deb` and the
# Homebrew build and runs beside them.
#
# Each crate is published on its own, in the order `ship.conf` lists them, which is
# where that order already lives. A crate already on the index is skipped, and the
# index is waited for rather than assumed, so a partial publish can be finished by
# running this again; `cargo publish --workspace` refuses the whole run once any
# member is on the index.
#
# The step is token-gated: it skips cleanly, with no failed run, unless a
# CRATES_IO_TOKEN secret is available. The excelano organisation carries one.
# Versions on crates.io are immutable: a bad one is yanked, never re-published, and
# the fix is the next number.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish from (e.g. v0.1.0). Defaults to the branch this is dispatched on.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatch runs this file from the branch it was started on and
          # publishes the tree named here, so a fix to the workflow can finish a
          # release cut before the fix existed.
          ref: ${{ inputs.tag || github.ref }}

      - name: Check for a crates.io token
        id: token
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: echo "present=${CRATES_IO_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -eu
          # The workspace manifest holds the version; the crates inherit it.
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          crates=$(sed -n 's/^crates=//p' ship.conf)
          echo "publishing ${crates} at ${version}"

          # crates.io asks for a User-Agent that says who is calling and refuses
          # a request without one.
          agent='plene release workflow (https://github.com/excelano/plene)'

          on_index() {
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: ${agent}" \
                  "https://crates.io/api/v1/crates/$1/$2")
              [ "$code" = 200 ]
          }

          for crate in $crates; do
              if on_index "$crate" "$version"; then
                  echo "== ${crate} ${version} is already on the index"
                  continue
              fi

              echo "== publishing ${crate} ${version}"
              cargo publish -p "$crate"

              # `cargo publish` waits for the crate to become resolvable and
              # gives up after a minute. The next crate in the list depends on
              # this one, so a run that raced the index would fail resolving it;
              # this waits again rather than assuming, and says so while it does.
              for attempt in $(seq 1 30); do
                  if on_index "$crate" "$version"; then
                      echo "   on the index after ${attempt} check(s)"
                      break
                  fi
                  sleep 10
              done
              on_index "$crate" "$version" ||
                  { echo "${crate} ${version} never appeared on the index" >&2; exit 1; }
          done
