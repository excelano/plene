[workspace]
resolver = "3"
members = ["crates/plene-core", "crates/plene", "crates/plene-gui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# The floor is ra_ap_syntax's; raise it when an upgrade of that pin raises theirs.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/excelano/plene"
homepage = "https://excelano.com/plene/"
keywords = ["rust", "readability", "syntax", "transcription", "learning"]

[workspace.dependencies]
plene-core = { path = "crates/plene-core", version = "0.3.0" }
ra_ap_syntax = "=0.0.352"

[profile.dist]
inherits = "release"
lto = "thin"
