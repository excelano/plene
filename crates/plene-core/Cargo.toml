[package]
name = "plene-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "../../README.md"
description = "Parses Rust source into per-line spans with each abbreviation and symbol token expanded into words, keyed by syntactic role"
categories = ["development-tools", "text-processing"]

[dependencies]
ra_ap_syntax.workspace = true
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# Not used directly. ra-ap-rustc_lexer asserts at compile time that unicode-ident and
# unicode-properties share a Unicode version; unicode-ident 1.0.25 moved to Unicode 18
# while unicode-properties 0.1.4 is on 17. Lift this cap when unicode-properties catches up.
unicode-ident = ">=1.0.22, <1.0.25"

[dev-dependencies]
insta = { version = "1.48", features = ["glob"] }
